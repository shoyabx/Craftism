<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Creator - Craftism</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- html2pdf.js for basic PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* Enhanced styles for DOCX imported content */
        .a4-page {
            font-family: 'Calibri', 'Arial', sans-serif;
            font-size: 11pt;
            line-height: 1.5;
        }

        /* Preserve Word-like heading styles */
        .a4-page h1 {
            font-size: 24pt;
            font-weight: bold;
            margin-top: 12pt;
            margin-bottom: 6pt;
            color: #000;
            font-family: 'Calibri', 'Arial', sans-serif;
        }

        .a4-page h2 {
            font-size: 18pt;
            font-weight: bold;
            margin-top: 10pt;
            margin-bottom: 4pt;
            color: #000;
            font-family: 'Calibri', 'Arial', sans-serif;
        }

        .a4-page h3 {
            font-size: 14pt;
            font-weight: bold;
            margin-top: 8pt;
            margin-bottom: 4pt;
            color: #000;
            font-family: 'Calibri', 'Arial', sans-serif;
        }

        .a4-page h4 {
            font-size: 12pt;
            font-weight: bold;
            margin-top: 6pt;
            margin-bottom: 3pt;
            color: #000;
            font-family: 'Calibri', 'Arial', sans-serif;
        }

        /* Paragraph spacing */
        .a4-page p {
            margin-bottom: 0.5em;
            margin-top: 0;
        }

        /* List styles */
        .a4-page ul,
        .a4-page ol {
            margin-left: 20px;
            margin-bottom: 0.5em;
            padding-left: 20px;
        }

        .a4-page li {
            margin-bottom: 0.25em;
        }

        /* Text formatting */
        .a4-page strong {
            font-weight: bold;
        }

        .a4-page em {
            font-style: italic;
        }

        .a4-page u {
            text-decoration: underline;
        }

        /* Tables */
        .a4-page table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1em;
        }

        .a4-page table td,
        .a4-page table th {
            border: 1px solid #000;
            padding: 4pt 8pt;
        }

        .a4-page table th {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        /* Links */
        .a4-page a {
            color: #0563C1;
            text-decoration: underline;
        }

        /* Preserve text alignment */
        .a4-page [style*="text-align: center"] {
            text-align: center;
        }

        .a4-page [style*="text-align: right"] {
            text-align: right;
        }

        .a4-page [style*="text-align: justify"] {
            text-align: justify;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="../index.html" class="logo">CRAFTISM</a>
            <ul class="nav-links">
                <li class="nav-item"><a href="../index.html">Home</a></li>
                <li class="nav-item"><a href="../about.html">About</a></li>
                <li class="nav-item" id="auth-item"><a href="../login.html" class="btn btn-outline"
                        style="padding: 8px 16px; font-size: 0.9rem;">Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="workspace-container" style="padding-top: 100px;">

        <!-- Editor Toolbar -->
        <div class="editor-toolbar">
            <div class="tool-group">
                <button class="tool-btn" data-command="bold" title="Bold"><i class="ph ph-text-b"></i></button>
                <button class="tool-btn" data-command="italic" title="Italic"><i class="ph ph-text-italic"></i></button>
                <button class="tool-btn" data-command="underline" title="Underline"><i
                        class="ph ph-text-underline"></i></button>
            </div>
            <div class="tool-group">
                <button class="tool-btn" data-command="justifyLeft" title="Left Align"><i
                        class="ph ph-text-align-left"></i></button>
                <button class="tool-btn" data-command="justifyCenter" title="Center Align"><i
                        class="ph ph-text-align-center"></i></button>
                <button class="tool-btn" data-command="justifyRight" title="Right Align"><i
                        class="ph ph-text-align-right"></i></button>
            </div>
            <div class="tool-group">
                <button class="tool-btn" data-command="insertUnorderedList" title="Bullet List"><i
                        class="ph ph-list-bullets"></i></button>
                <button class="tool-btn" data-command="insertOrderedList" title="Numbered List"><i
                        class="ph ph-list-numbers"></i></button>
            </div>
            <div class="tool-group">
                <select id="font-selector" title="Font Family"
                    style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 0.9rem; cursor: pointer; background: white; font-family: inherit;">
                    <option value="">Font</option>
                    <option value="Arial" style="font-family: Arial;">Arial</option>
                    <option value="Calibri" style="font-family: Calibri;">Calibri</option>
                    <option value="'Times New Roman'" style="font-family: 'Times New Roman';">Times New Roman</option>
                    <option value="Helvetica" style="font-family: Helvetica;">Helvetica</option>
                    <option value="Verdana" style="font-family: Verdana;">Verdana</option>
                    <option value="Tahoma" style="font-family: Tahoma;">Tahoma</option>
                    <option value="Georgia" style="font-family: Georgia;">Georgia</option>
                    <option value="Cambria" style="font-family: Cambria;">Cambria</option>
                    <option value="'Trebuchet MS'" style="font-family: 'Trebuchet MS';">Trebuchet MS</option>
                    <option value="Garamond" style="font-family: Garamond;">Garamond</option>
                </select>
            </div>
            <div class="tool-group" style="margin-left: auto;">
                <button class="btn btn-primary" id="btn-retrieve-draft"
                    style="padding: 8px 16px; font-size: 0.9rem;">Draft</button>
                <button class="btn btn-primary" id="btn-save-draft"
                    style="padding: 8px 16px; font-size: 0.9rem; background-color: #10b981;">Save</button>
                <button class="btn btn-primary" id="btn-download-pdf"
                    style="padding: 8px 16px; font-size: 0.9rem;background-color: #060606;">Download</button>
            </div>
        </div>

        <!-- A4 Page Workspace -->
        <div id="resume-page" class="a4-page" contenteditable="true">
            <p><br></p> <!-- Empty paragraph to allow cursor focus -->
        </div>

    </div>


<!-- Footer -->
<footer class="footer">
    <div class="container">
        <h3>CRAFTISM</h3>
        <p>&copy; 2026 Craftism. All rights reserved.</p>
        <div class="footer-links">
            <a href="http://linkedin.com/in/mshoyab"><i class="ph ph-linkedin-logo"></i></a>
            <a href="https://github.com/shoyabx"><i class="ph ph-github-logo"></i></a>
            <a href="mailto:md.shoyab@zohomail.com"><i class="ph ph-envelope"></i></a>
        </div>
    </div>
</footer>

<!-- Scripts -->
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
    <script src="../js/modules/resume.js"></script>
</body>

</html>
