<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Templates — Craftism</title>
    <meta name="description"
        content="Build a professional resume with live preview, multiple layouts, and full customization.">

    <!-- Google Fonts: 8 professional resume fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Merriweather:wght@300;400;700&family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:wght@300;400;600;700&family=Lato:wght@300;400;700&family=Crimson+Pro:wght@300;400;600;700&family=Libre+Baskerville:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">

    <!-- Project styles -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- DOCX parser -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <!-- PDF parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>if(typeof pdfjsLib!=='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

    <style>
        /* ═══════════════════════════════════════════
           APP SHELL
        ═══════════════════════════════════════════ */
        :root {
            --panel-bg: #ffffff;
            --app-bg: #f0f2f5;
            --border: #e2e8f0;
            --muted: #64748b;
            --accent: #F66B0E;
            --accent-lt: #fff4ed;

            /* Resume CSS variables — controlled by JS */
            --r-primary: #1a3c5e;
            --r-text: #1e293b;
            --r-muted: #64748b;
            --r-font: 'Inter', sans-serif;
            --r-base: 13px;
            --r-gap: 16px;
            --r-sgap: 22px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--app-bg);
            overflow-x: hidden;
        }

        /* ── App layout ── */
        .builder-shell {
            display: grid;
            grid-template-columns: 290px 1fr;
            height: calc(100vh - 64px);
            margin-top: 64px;
        }

        /* ═══════════════════════════════════════════
           CONTROLS PANEL
        ═══════════════════════════════════════════ */
        .ctrl-panel {
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .ctrl-head {
            position: sticky;
            top: 0;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            padding: 12px 18px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            z-index: 10;
        }

        .ctrl-group {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        .ctrl-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--muted);
            margin-bottom: 9px;
        }

        /* Layout buttons */
        .layout-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .lay-btn {
            border: 2px solid var(--border);
            background: #f8fafc;
            border-radius: 7px;
            padding: 8px 4px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--muted);
            transition: all 0.15s;
        }

        .lay-btn:hover {
            border-color: var(--accent);
            background: var(--accent-lt);
        }

        .lay-btn.active {
            border-color: var(--accent);
            background: var(--accent-lt);
            color: var(--accent);
        }

        .lay-icon {
            display: flex;
            gap: 2px;
            width: 28px;
            height: 20px;
        }

        .lay-icon .b {
            background: #cbd5e1;
            border-radius: 2px;
            height: 100%;
        }

        .lay-btn.active .lay-icon .b {
            background: var(--accent);
        }

        .lay-icon.s1 .b {
            flex: 1;
        }

        .lay-icon.s2 .b:first-child {
            flex: 0.38;
        }

        .lay-icon.s2 .b:last-child {
            flex: 0.62;
        }

        .lay-icon.s3 .b {
            flex: 1;
            height: 55%;
            margin-top: auto;
        }

        /* Font options */
        .font-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .font-opt {
            padding: 6px 10px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 0.84rem;
            cursor: pointer;
            transition: all 0.12s;
            background: white;
        }

        .font-opt:hover {
            border-color: var(--accent);
        }

        .font-opt.active {
            border-color: var(--accent);
            background: var(--accent-lt);
        }

        /* Toggle strip */
        .tog-strip {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 7px;
            overflow: hidden;
        }

        .tog {
            flex: 1;
            padding: 6px 4px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            border-right: 1px solid var(--border);
            transition: all 0.12s;
        }

        .tog:last-child {
            border-right: none;
        }

        .tog:hover {
            background: #f8fafc;
        }

        .tog.active {
            background: var(--accent);
            color: white;
        }

        /* Color swatches */
        .swatches {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .swatch {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .swatch.active {
            border-color: #1e293b;
            transform: scale(1.2);
        }

        .custom-color-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .custom-color-row label {
            font-size: 0.72rem;
            color: var(--muted);
        }

        .custom-color-row input[type=color] {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            padding: 1px;
        }

        /* Section manager */
        .sec-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .sec-row {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            font-size: 0.78rem;
        }

        .sec-row input[type=checkbox] {
            cursor: pointer;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        .sec-row .sec-name {
            flex: 1;
            font-weight: 500;
            color: #334155;
        }

        .sec-row.off .sec-name {
            color: #94a3b8;
        }

        .sec-arrows {
            display: flex;
            gap: 2px;
        }

        .arr-btn {
            border: none;
            background: #f1f5f9;
            border-radius: 4px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 0.68rem;
            color: #475569;
            line-height: 1.5;
            transition: all 0.12s;
        }

        .arr-btn:hover {
            background: var(--accent);
            color: white;
        }

        .arr-btn:disabled {
            opacity: 0.28;
            pointer-events: none;
        }

        /* Download button */
        .dl-btn {
            width: 100%;
            padding: 10px;
            background: #112B3C;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.18s;
        }

        .dl-btn:hover {
            background: #0f1f2b;
            transform: translateY(-1px);
        }

        /* ═══════════════════════════════════════════
           PREVIEW PANEL
        ═══════════════════════════════════════════ */
        .preview-panel {
            overflow-y: auto;
            padding: 28px 24px;
            background: var(--app-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ═══════════════════════════════════════════
           RESUME PAPER
        ═══════════════════════════════════════════ */
        .resume-paper {
            width: 750px;
            background: white;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.10), 0 0 0 1px rgba(0, 0, 0, 0.04);
            border-radius: 2px;
            font-family: var(--r-font);
            font-size: var(--r-base);
            color: var(--r-text);
            line-height: 1.5;
            overflow: hidden;
        }

        /* ── Density scales ── */
        .dn-compact {
            --r-gap: 10px;
            --r-sgap: 14px;
        }

        .dn-standard {
            --r-gap: 16px;
            --r-sgap: 22px;
        }

        .dn-airy {
            --r-gap: 22px;
            --r-sgap: 30px;
        }

        /* ── Font size scales ── */
        .fs-sm {
            --r-base: 11px;
        }

        .fs-md {
            --r-base: 13px;
        }

        .fs-lg {
            --r-base: 15px;
        }

        /* ════════════════════
           LAYOUT A — Single
        ════════════════════ */
        .lay-single {
            padding: var(--r-gap) calc(var(--r-gap) * 2);
        }

        .lay-single .r-header {
            text-align: center;
            padding-bottom: var(--r-gap);
            border-bottom: 2.5px solid var(--r-primary);
            margin-bottom: var(--r-sgap);
        }

        .lay-single .r-contact-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3px 14px;
            margin-top: 7px;
        }

        /* ════════════════════
           LAYOUT B — Two Col
        ════════════════════ */
        .lay-two {
            display: grid;
            grid-template-columns: 210px 1fr;
            min-height: 900px;
        }

        .lay-two .r-sidebar {
            background: var(--r-primary);
            color: white;
            padding: calc(var(--r-gap) * 1.4);
        }

        .lay-two .r-sidebar .r-name {
            color: white;
        }

        .lay-two .r-sidebar .r-title {
            color: rgba(255, 255, 255, 0.75);
        }

        .lay-two .r-sidebar .r-contact {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.82em;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .lay-two .r-sidebar .sec-title {
            color: rgba(255, 255, 255, 0.95);
            border-bottom-color: rgba(255, 255, 255, 0.25);
        }

        .lay-two .r-sidebar .skill-tag {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .lay-two .r-sidebar .r-muted {
            color: rgba(255, 255, 255, 0.7);
        }

        .lay-two .r-main {
            padding: calc(var(--r-gap) * 1.4);
        }

        /* ════════════════════
           LAYOUT C — Compact
        ════════════════════ */
        .lay-compact {
            padding: 18px 24px;
        }

        .lay-compact .r-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 8px;
            border-bottom: 1.5px solid var(--r-primary);
            margin-bottom: 12px;
        }

        .lay-compact .r-header-right {
            text-align: right;
        }

        .lay-compact .r-contact-item {
            font-size: 0.78em;
        }

        /* ═══════════════════════════════════════════
           RESUME TYPOGRAPHY
        ═══════════════════════════════════════════ */
        .r-name {
            font-size: calc(var(--r-base) * 2.1);
            font-weight: 700;
            color: var(--r-primary);
            line-height: 1.1;
        }

        .r-title {
            font-size: calc(var(--r-base) * 1.08);
            color: var(--r-muted);
            font-weight: 400;
            margin-top: 3px;
        }

        .r-contact-item {
            font-size: 0.82em;
            color: var(--r-muted);
        }

        /* Section */
        .r-section {
            margin-bottom: var(--r-sgap);
        }

        .sec-title {
            font-size: calc(var(--r-base) * 0.9);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--r-primary);
            border-bottom: 1.5px solid var(--r-primary);
            padding-bottom: 3px;
            margin-bottom: calc(var(--r-gap) * 0.6);
        }

        /* Experience */
        .exp-item {
            margin-bottom: calc(var(--r-gap) * 0.75);
        }

        .exp-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }

        .exp-role {
            font-weight: 600;
            font-size: calc(var(--r-base) * 1.0);
        }

        .exp-dur {
            font-size: 0.8em;
            color: var(--r-muted);
            white-space: nowrap;
        }

        .exp-co {
            font-size: 0.88em;
            color: var(--r-muted);
            margin: 2px 0;
        }

        .exp-desc {
            font-size: 0.88em;
            line-height: 1.55;
            margin-top: 4px;
        }

        /* Education */
        .edu-item {
            margin-bottom: calc(var(--r-gap) * 0.6);
        }

        .edu-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .edu-deg {
            font-weight: 600;
            font-size: 0.92em;
        }

        .edu-yr {
            font-size: 0.8em;
            color: var(--r-muted);
        }

        .edu-inst {
            font-size: 0.85em;
            color: var(--r-muted);
            margin-top: 1px;
        }

        /* Skills */
        .skill-group {
            margin-bottom: calc(var(--r-gap) * 0.55);
        }

        .skill-cat {
            font-weight: 600;
            font-size: 0.82em;
            margin-bottom: 4px;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .skill-tag {
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px 9px;
            font-size: 0.78em;
        }

        /* Summary */
        .summary-text {
            font-size: 0.92em;
            line-height: 1.65;
            color: var(--r-text);
        }

        /* Certifications */
        .cert-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }

        .cert-name {
            font-weight: 500;
            font-size: 0.9em;
        }

        .cert-meta {
            font-size: 0.8em;
            color: var(--r-muted);
        }

        /* ═══════════════════════════════════════════
           CONTENTEDITABLE STATES
        ═══════════════════════════════════════════ */
        [contenteditable] {
            outline: none;
            border-radius: 3px;
            transition: background 0.12s;
            min-width: 10px;
        }

        [contenteditable]:hover {
            background: rgba(246, 107, 14, 0.07);
        }

        [contenteditable]:focus {
            background: rgba(246, 107, 14, 0.12);
            outline: 1.5px dashed var(--accent);
        }

        /* Template presets grid */
        .tpl-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }

        .tpl-btn {
            border: 2px solid var(--border);
            background: #f8fafc;
            border-radius: 7px;
            padding: 7px 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.62rem;
            font-weight: 600;
            color: var(--muted);
            transition: all 0.15s;
        }

        .tpl-btn:hover {
            border-color: var(--accent);
            background: var(--accent-lt);
        }

        .tpl-btn.active {
            border-color: var(--accent);
            background: var(--accent-lt);
            color: var(--accent);
        }

        .tpl-name {
            font-size: 0.72rem;
            font-weight: 700;
        }

        .tpl-desc {
            font-size: 0.58rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Save/Load section */
        .save-row {
            display: flex;
            gap: 5px;
            margin-top: 6px;
        }

        .save-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.15s;
        }

        .save-btn.primary {
            background: var(--accent);
            color: white;
        }

        .save-btn.primary:hover {
            background: #d95a00;
        }

        .save-btn.secondary {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid var(--border);
        }

        .save-btn.secondary:hover {
            background: #e2e8f0;
        }

        #save-status {
            font-size: 0.68rem;
            color: var(--muted);
            text-align: center;
            margin-top: 4px;
            min-height: 1em;
        }

        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 6px;
        }

        .saved-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.12s;
        }

        .saved-item:hover {
            border-color: var(--accent);
            background: var(--accent-lt);
        }

        .saved-item .si-name {
            flex: 1;
            font-weight: 500;
        }

        .saved-item .si-date {
            font-size: 0.65rem;
            color: #94a3b8;
        }

        /* Upload dropzone (inline in sidebar) */
        .upload-zone { border: 2px dashed var(--border); border-radius: 7px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.15s; background: #fafbfc; }
        .upload-zone:hover, .upload-zone.drag-over { border-color: var(--accent); background: var(--accent-lt); }
        .upload-zone .uz-icon { font-size: 1.4rem; color: #94a3b8; margin-bottom: 4px; }
        .upload-zone .uz-text { font-size: 0.68rem; color: var(--muted); }
        .upload-zone input[type=file] { display: none; }

        /* ATS Score badge */
        .ats-panel { margin-top: 8px; }
        .ats-score-badge { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; background: #f0fdf4; border: 1px solid #bbf7d0; }
        .ats-score-badge.grade-a { background: #f0fdf4; border-color: #bbf7d0; }
        .ats-score-badge.grade-b { background: #fefce8; border-color: #fde68a; }
        .ats-score-badge.grade-c { background: #fff7ed; border-color: #fed7aa; }
        .ats-score-badge.grade-d { background: #fef2f2; border-color: #fecaca; }
        .ats-num { font-size: 1.6rem; font-weight: 800; line-height: 1; }
        .ats-grade-a .ats-num { color: #16a34a; }
        .ats-grade-b .ats-num { color: #ca8a04; }
        .ats-grade-c .ats-num { color: #ea580c; }
        .ats-grade-d .ats-num { color: #dc2626; }
        .ats-label { font-size: 0.65rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .ats-flags { margin-top: 6px; }
        .ats-flag { font-size: 0.68rem; padding: 2px 0; display: flex; align-items: baseline; gap: 5px; }
        .ats-flag .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .ats-flag .dot.pass { background: #16a34a; }
        .ats-flag .dot.fail { background: #dc2626; }

        /* Mode toggle */
        .mode-strip { display: flex; border: 2px solid var(--accent); border-radius: 7px; overflow: hidden; margin-top: 6px; }
        .mode-btn { flex: 1; padding: 6px 4px; border: none; background: white; cursor: pointer; font-size: 0.68rem; font-weight: 700; color: var(--accent); transition: all 0.12s; text-align: center; }
        .mode-btn.active { background: var(--accent); color: white; }
        .mode-btn:first-child { border-right: 1px solid var(--accent); }

        /* Paper size */
        .paper-a4 {
            width: 750px;
        }

        .paper-letter {
            width: 770px;
        }

        /* ═══════════════════════════════════════════
           PRINT — PDF export
        ═══════════════════════════════════════════ */
        @media print {
            .builder-shell {
                display: block;
                margin: 0;
                height: auto;
            }

            .ctrl-panel,
            .navbar {
                display: none !important;
            }

            .preview-panel {
                padding: 0;
                background: white;
            }

            .resume-paper {
                width: 100%;
                box-shadow: none;
                border-radius: 0;
            }

            [contenteditable]:hover,
            [contenteditable]:focus {
                background: transparent !important;
                outline: none !important;
            }
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE
        ═══════════════════════════════════════════ */
        @media (max-width: 960px) {
            .builder-shell {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }

            .ctrl-panel {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .resume-paper {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-content">
            <a href="../index.html" class="logo">CRAFTISM</a>
            <ul class="nav-links">
                <li class="nav-item"><a href="../index.html">Home</a></li>
                <li class="nav-item"><a href="../about.html">About</a></li>
                <li class="nav-item" id="auth-item">
                    <a href="../login.html" class="btn btn-outline" style="padding:8px 16px;font-size:0.9rem;">Login</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- App Shell -->
    <div class="builder-shell">

        <!-- ════════════════════════════════
             CONTROLS PANEL
        ════════════════════════════════ -->
        <aside class="ctrl-panel">
            <div class="ctrl-head">Resume Builder</div>

            <!-- Upload Resume -->
            <div class="ctrl-group">
                <div class="ctrl-label">Upload Resume</div>
                <div class="upload-zone" id="upload-zone">
                    <div class="uz-icon"><i class="ph ph-upload-simple"></i></div>
                    <div class="uz-text">Drop PDF or DOCX here, or click</div>
                    <input type="file" id="upload-input" accept=".pdf,.docx,.doc,.txt">
                </div>
                <div id="ats-panel" class="ats-panel" style="display:none;"></div>
                <div id="mode-toggle" style="display:none;"></div>
            </div>

            <!-- Template Presets -->
            <div class="ctrl-group">
                <div class="ctrl-label">Template</div>
                <div class="tpl-grid" id="tpl-grid"><!-- rendered by JS --></div>
            </div>

            <!-- Font -->
            <div class="ctrl-group">
                <div class="ctrl-label">Font</div>
                <div class="font-list" id="font-list"><!-- rendered by JS --></div>
            </div>

            <!-- Font Size -->
            <div class="ctrl-group">
                <div class="ctrl-label">Size</div>
                <div class="tog-strip">
                    <button class="tog" data-sz="sm" onclick="setSize('sm')">Small</button>
                    <button class="tog active" data-sz="md" onclick="setSize('md')">Medium</button>
                    <button class="tog" data-sz="lg" onclick="setSize('lg')">Large</button>
                </div>
            </div>

            <!-- Color Themes -->
            <div class="ctrl-group">
                <div class="ctrl-label">Color Theme</div>
                <div class="swatches">
                    <div class="swatch active" style="background:#1a3c5e" data-color="#1a3c5e" title="Navy"
                        onclick="setColor('#1a3c5e')"></div>
                    <div class="swatch" style="background:#334155" data-color="#334155" title="Slate"
                        onclick="setColor('#334155')"></div>
                    <div class="swatch" style="background:#1a4731" data-color="#1a4731" title="Forest"
                        onclick="setColor('#1a4731')"></div>
                    <div class="swatch" style="background:#7c2d12" data-color="#7c2d12" title="Auburn"
                        onclick="setColor('#7c2d12')"></div>
                    <div class="swatch" style="background:#4c1d95" data-color="#4c1d95" title="Violet"
                        onclick="setColor('#4c1d95')"></div>
                    <div class="swatch" style="background:#0f4c75" data-color="#0f4c75" title="Ocean"
                        onclick="setColor('#0f4c75')"></div>
                </div>
                <div class="custom-color-row">
                    <label>Custom</label>
                    <input type="color" id="custom-color" value="#1a3c5e" oninput="setColor(this.value, true)">
                </div>
            </div>

            <!-- Spacing -->
            <div class="ctrl-group">
                <div class="ctrl-label">Spacing</div>
                <div class="tog-strip">
                    <button class="tog" data-dn="compact" onclick="setDensity('compact')">Compact</button>
                    <button class="tog active" data-dn="standard" onclick="setDensity('standard')">Standard</button>
                    <button class="tog" data-dn="airy" onclick="setDensity('airy')">Airy</button>
                </div>
            </div>

            <!-- Paper Size -->
            <div class="ctrl-group">
                <div class="ctrl-label">Paper Size</div>
                <div class="tog-strip">
                    <button class="tog active" data-paper="a4" onclick="setPaper('a4')">A4</button>
                    <button class="tog" data-paper="letter" onclick="setPaper('letter')">Letter</button>
                </div>
            </div>

            <!-- Sections -->
            <div class="ctrl-group">
                <div class="ctrl-label">Sections</div>
                <div class="sec-list" id="sec-list"></div>
            </div>

            <!-- Save / Load (shown only when logged in) -->
            <div class="ctrl-group" id="cloud-section" style="display:none;">
                <div class="ctrl-label">Cloud Save</div>
                <div class="save-row">
                    <button class="save-btn primary" onclick="saveResume()"><i class="ph ph-cloud-arrow-up"></i>
                        Save</button>
                    <button class="save-btn secondary" onclick="loadResumes()"><i class="ph ph-cloud-arrow-down"></i>
                        Load</button>
                </div>
                <div id="save-status"></div>
                <div class="saved-list" id="saved-list"></div>
            </div>

            <!-- Download -->
            <div class="ctrl-group">
                <button class="dl-btn" onclick="printResume()">
                    <i class="ph ph-download-simple"></i> Download PDF
                </button>
            </div>
        </aside>

        <!-- ════════════════════════════════
             PREVIEW PANEL
        ════════════════════════════════ -->
        <main class="preview-panel">
            <div id="resume-preview"></div>
        </main>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/modules/resume_parser.js?v=3"></script>
    <script src="../js/modules/upload_handler.js?v=3"></script>
    <script src="../js/modules/templates.js?v=3"></script>
</body>

</html>
