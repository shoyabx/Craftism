<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Craftism</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body
    style="background: var(--color-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="card" style="width: 100%; max-width: 400px; padding: 3rem; cursor: default;">
        <h2 style="text-align: center; margin-bottom: 2rem; color: var(--color-primary);">Join Craftism</h2>

        <form id="register-form">
            <div style="margin-bottom: 1.5rem;">
                <label for="name" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Full Name</label>
                <input type="text" id="name" required
                    style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 4px; font-family: var(--font-body);">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Email</label>
                <input type="email" id="email" required
                    style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 4px; font-family: var(--font-body);">
            </div>

            <div style="margin-bottom: 2rem;">
                <label for="password" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Password</label>
                <input type="password" id="password" required
                    style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 4px; font-family: var(--font-body);">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem;">
            Already a member? <a href="login.html" style="color: var(--color-accent); font-weight: bold;">Login</a>
        </p>
        <p style="text-align: center; margin-top: 1rem;">
            <a href="index.html" style="color: #888; font-size: 0.9rem;">&larr; Back to Home</a>
        </p>

        <div id="error-msg" style="color: red; text-align: center; margin-top: 1rem; display: none;"></div>
        <div id="success-msg" style="color: green; text-align: center; margin-top: 1rem; display: none;">
            Registration successful! Redirecting...
        </div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            if (!supabaseClient) initSupabase();

            try {
                // 1. Sign up user
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                        }
                    }
                });

                if (authError) throw authError;

                // 2. Create profile entry (Trigger usually handles this, but since we have a manual table logic in setup.sql without trigger, 
                //    we might need to insert manually OR rely on a trigger if created. 
                //    My setup.sql didn't strictly add a trigger, so let's try manual insert safely.)

                const user = authData.user;
                if (user) {
                    const { error: profileError } = await supabaseClient
                        .from('profiles')
                        .insert([
                            { id: user.id, email: email, full_name: name }
                        ]);

                    if (profileError) {
                        // Ignore duplicate key error if trigger exists
                        console.warn('Profile creation warning:', profileError);
                    }
                }

                successMsg.style.display = 'block';
                errorMsg.style.display = 'none';

                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 1500);

            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
            }
        });
    </script>
</body>

</html>
