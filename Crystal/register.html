<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Craftism</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body
    style="background: var(--color-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="card" style="width: 100%; max-width: 400px; padding: 3rem; cursor: default;">
        <h2 style="text-align: center; margin-bottom: 2rem; color: var(--color-primary);">Join Craftism</h2>

        <form id="register-form">
            <div style="margin-bottom: 1.5rem;">
                <label for="name" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Full Name</label>
                <input type="text" id="name" required
                    style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 4px; font-family: var(--font-body);">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Email</label>
                <input type="email" id="email" required
                    style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 4px; font-family: var(--font-body);">
            </div>

            <div style="margin-bottom: 2rem;">
                <label for="password" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Password</label>
                <input type="password" id="password" required
                    style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 4px; font-family: var(--font-body);">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem;">
            Already a member? <a href="login.html" style="color: var(--color-accent); font-weight: bold;">Login</a>
        </p>
        <p style="text-align: center; margin-top: 1rem;">
            <a href="index.html" style="color: #888; font-size: 0.9rem;">&larr; Back to Home</a>
        </p>

        <div id="error-msg" style="color: red; text-align: center; margin-top: 1rem; display: none;"></div>
        <div id="success-msg" style="color: green; text-align: center; margin-top: 1rem; display: none;"></div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Reset messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            try {
                // Ensure Supabase is initialized
                if (!supabaseClient) {
                    const ready = await waitForSupabase();
                    if (!ready) throw new Error('Could not connect to authentication service. Please refresh the page and try again.');
                }

                // 1. Sign up user
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { full_name: name }
                    }
                });

                if (authError) throw authError;

                // Check if email confirmation is required
                const user = authData.user;
                const session = authData.session;

                if (user && !session) {
                    // Email confirmation required
                    successMsg.textContent = 'Registration successful! Please check your email to confirm your account.';
                    successMsg.style.display = 'block';
                    submitBtn.textContent = 'Check Your Email';
                    return;
                }

                // 2. Create profile entry if session is active
                if (user && session) {
                    const { error: profileError } = await supabaseClient
                        .from('profiles')
                        .insert([{ id: user.id, email: email, full_name: name }]);

                    if (profileError && profileError.code !== '23505') {
                        // 23505 = unique violation (profile already exists via trigger), safe to ignore
                        console.warn('Profile creation warning:', profileError);
                    }
                }

                successMsg.textContent = 'Registration successful! Redirecting...';
                successMsg.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 1500);

            } catch (error) {
                console.error('Registration error:', error);
                errorMsg.textContent = error.message || 'Registration failed. Please try again.';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>

</html>
